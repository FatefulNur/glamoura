<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>দাম নির্ধারণ · Glamoura</title>
<meta name="description" content="কেনা দাম আর ডেলিভারি খরচ ধরে কত দামে বিক্রি করলে কত লাভ থাকবে।">
<meta name="theme-color" content="#1d6b4e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="bar"></div>
<main class="wrap">
<header><h1>দাম নির্ধারণ</h1><p class="sub">কেনা দাম আর ডেলিভারি খরচ ধরে কত দামে বিক্রি করলে কত লাভ থাকবে।</p></header>

<section class="card">
<div class="row">
<label>কেনা দাম (Unit Cost) ৳<input id="cost" type="number" inputmode="decimal" value="650"></label>
<label>Extra Cost প্রতি পিস ৳<input id="extra" type="number" inputmode="decimal" value="0"></label>
<label>প্যাকিং ৳<input id="packing" type="number" inputmode="decimal" value="0"></label>
<label>বিজ্ঞাপন খরচ / অর্ডার ৳<input id="ad" type="number" inputmode="decimal" value="0"></label>
</div>
<div class="row" style="margin-top:12px">
<label>রুট<select id="route"></select></label>
<label>ওজন (kg)<input id="kg" type="number" step="0.05" inputmode="decimal" value="0.6"></label>
<label>ডেলিভারি চার্জ<select id="delivery"><option value="customer">কাস্টমার দেবে</option><option value="free">ফ্রি (আমি দেব)</option></select></label>
<label>কাঙ্ক্ষিত লাভ প্রতি পিস ৳<input id="target" type="number" inputmode="decimal" value="150"></label>
</div>
<div class="row" style="margin-top:12px">
<label>আমি যে দামে বিক্রি করছি ৳ (যাচাইয়ের জন্য)<input id="myprice" type="number" inputmode="decimal" value="799"></label>
</div>
</section>
<section class="card" aria-live="polite"><h2>ফলাফল</h2><table id="out"></table><div class="note" id="warn" hidden style="margin-top:12px"></div></section>
<p class="sub">এক পিসের অর্ডার ধরে হিসাব। একাধিক পিস হলে অর্ডার ক্যালকুলেটর ব্যবহার করুন। COD চার্জ পণ্যের দামের ওপর ধরা হয়েছে।</p>

</main>
<script src="assets/pathao.js"></script>
<script src="assets/common.js"></script>
<script>

(function(){
var $=function(i){return document.getElementById(i)},rates=G.store.get('gl-rates-v1',null)||Pathao.DEFAULT_RATES,K='gl-price-v1';
$('route').innerHTML=Object.keys(rates.routes).map(function(k){return '<option value="'+k+'">'+rates.routes[k].label+'</option>'}).join('');
var ids=['cost','extra','packing','ad','route','kg','delivery','target','myprice'],s=G.store.get(K,{});
ids.forEach(function(i){if(s[i]!=null)$(i).value=s[i]});
function row(a,b,c){return '<tr class="'+(c||'')+'"><td>'+a+'</td><td class="n">'+b+'</td></tr>'}
function run(){
 var v={};ids.forEach(function(i){v[i]=$(i).value});G.store.set(K,v);
 var t=G.taka,cost=G.num(v.cost)+G.num(v.extra);
 var p={cost:cost,packing:G.num(v.packing),adCost:G.num(v.ad),route:v.route,kg:G.num(v.kg),delivery:v.delivery,target:G.num(v.target),codBase:'product'};
 var sg=Pathao.suggestPrice(rates,p),nice=Pathao.nice(sg.exact);
 var my=Pathao.order(rates,{items:[{qty:1,price:G.num(v.myprice),cost:cost}],route:v.route,kg:G.num(v.kg),delivery:v.delivery,packing:p.packing,adCost:p.adCost,codBase:'product'});
 var h=row('কুরিয়ার চার্জ (Pathao)',t(sg.courier))+row('কাস্টমারের কাছ থেকে ডেলিভারি চার্জ',t(sg.charge))
  +row('কাঙ্ক্ষিত লাভের জন্য ন্যূনতম দাম',t(sg.price),'sub')
  +row('প্রস্তাবিত দাম (৯ দিয়ে শেষ)','<span class="big">'+t(nice)+'</span>','total')
  +row('আপনার দামে ('+t(G.num(v.myprice))+') Pathao COD চার্জ',t(my.codFee))
  +row('আপনার দামে নিট লাভ','<span class="'+(my.profit<0?'neg':'pos')+'">'+t(my.profit)+'</span>','total')
  +row('মার্জিন',G.bn(my.margin)+'%');
 $('out').innerHTML=h;
 var w=[];if(my.profit<0)w.push('এই দামে লোকসান।');else if(my.profit<G.num(v.target))w.push('লাভ কাঙ্ক্ষিত '+t(G.num(v.target))+' এর কম।');
 $('warn').hidden=!w.length;$('warn').innerHTML=w.join('<br>');
}
document.addEventListener('input',run);document.addEventListener('change',run);run();
})();

</script>
</body>
</html>
